<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🏎 F1 Manager</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="drivers.html">Drivers</a>
                <a class="nav-link" href="constructors.html">Constructors</a>
                <a class="nav-link" href="races.html">Races</a>
                <a class="nav-link" href="stats.html">Stats</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold">Welcome to F1 Manager</h1>
            <p class="lead text-muted">Explore drivers, constructors, races and statistics from Formula 1 history.</p>
        </div>
        <div class="row g-4">
            <div class="col-md-3">
                <a href="drivers.html" class="text-decoration-none">
                    <div class="card text-center h-100 shadow-sm">
                        <div class="card-body">
                            <h2>🏁</h2>
                            <h5 class="card-title">Drivers</h5>
                            <p class="card-text text-muted">Browse all F1 drivers</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="constructors.html" class="text-decoration-none">
                    <div class="card text-center h-100 shadow-sm">
                        <div class="card-body">
                            <h2>🔧</h2>
                            <h5 class="card-title">Constructors</h5>
                            <p class="card-text text-muted">Browse all F1 teams</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="races.html" class="text-decoration-none">
                    <div class="card text-center h-100 shadow-sm">
                        <div class="card-body">
                            <h2>📅</h2>
                            <h5 class="card-title">Races</h5>
                            <p class="card-text text-muted">Browse all F1 races</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-3">
                <a href="stats.html" class="text-decoration-none">
                    <div class="card text-center h-100 shadow-sm">
                        <div class="card-body">
                            <h2>📊</h2>
                            <h5 class="card-title">Stats</h5>
                            <p class="card-text text-muted">General statistics</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
