<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
    <style>
      .title{font:700 30px Arial, sans-serif;fill:#111827}.h{font:700 18px Arial,sans-serif;fill:#111827}.t{font:15px Arial,sans-serif;fill:#111827}.s{font:14px Arial,sans-serif;fill:#374151}.small{font:13px Arial,sans-serif;fill:#4b5563}.box{rx:18;ry:18;stroke-width:2}.arrow{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 6}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="62" text-anchor="middle" class="title">F1 Manager Web — AWS Infrastructure</text>

  <rect x="80" y="140" width="330" height="185" class="box" fill="#24292f" stroke="#111827"/>
  <text x="245" y="175" text-anchor="middle" font="700 18px Arial" fill="white">GitHub Organization</text>
  <text x="245" y="205" text-anchor="middle" font="15px Arial" fill="white">f1-manager-dam-daw</text>
  <text x="245" y="242" text-anchor="middle" font="15px Arial" fill="white">Repo: f1-manager-web</text>
  <text x="245" y="270" text-anchor="middle" font="15px Arial" fill="white">Issues · PRs · Tags · Release 1.0</text>

  <rect x="650" y="140" width="350" height="185" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="825" y="175" text-anchor="middle" class="h">Development Team</text>
  <text x="825" y="205" text-anchor="middle" class="t">IntelliJ / VS Code / Terminal</text>
  <text x="825" y="243" text-anchor="middle" class="t">Java Web App</text>
  <text x="825" y="270" text-anchor="middle" class="t">HTML · CSS · Bootstrap · JavaScript</text>

  <rect x="1180" y="165" width="280" height="120" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="1320" y="202" text-anchor="middle" class="h">Browser</text>
  <text x="1320" y="235" text-anchor="middle" class="t">Local demo / user access</text>

  <rect x="360" y="425" width="900" height="430" rx="24" ry="24" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="810" y="465" text-anchor="middle" font="700 22px Arial" fill="#9a3412">AWS Cloud</text>

  <rect x="425" y="520" width="315" height="180" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="582" y="555" text-anchor="middle" class="h">Security Group</text>
  <text x="582" y="588" text-anchor="middle" class="t">Inbound TCP 3306</text>
  <text x="582" y="615" text-anchor="middle" class="t">Only authorized IPs</text>
  <text x="582" y="655" text-anchor="middle" class="small">Never open DB to 0.0.0.0/0</text>
  <text x="582" y="677" text-anchor="middle" class="small">permanently</text>

  <rect x="875" y="500" width="330" height="235" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="1040" y="535" text-anchor="middle" class="h">Amazon RDS</text>
  <text x="1040" y="565" text-anchor="middle" class="t">MariaDB / MySQL</text>
  <text x="1040" y="603" text-anchor="middle" class="t">Database: f1_manager</text>
  <text x="1040" y="630" text-anchor="middle" class="t">User: f1_app</text>
  <text x="1040" y="670" text-anchor="middle" class="t">Tables:</text>
  <text x="1040" y="698" text-anchor="middle" class="t">drivers · constructors · races · results</text>

  <rect x="85" y="510" width="275" height="230" class="box" fill="#f3f4f6" stroke="#6b7280" stroke-dasharray="8 6"/>
  <text x="222" y="545" text-anchor="middle" class="h">Local config / env vars</text>
  <text x="222" y="580" text-anchor="middle" class="t">DB_HOST</text>
  <text x="222" y="605" text-anchor="middle" class="t">DB_PORT</text>
  <text x="222" y="630" text-anchor="middle" class="t">DB_NAME</text>
  <text x="222" y="655" text-anchor="middle" class="t">DB_USER</text>
  <text x="222" y="680" text-anchor="middle" class="t">DB_PASSWORD</text>
  <text x="222" y="720" text-anchor="middle" class="small">Not committed to GitHub</text>

  <rect x="1290" y="510" width="260" height="170" class="box" fill="#ede9fe" stroke="#7c3aed" stroke-dasharray="8 6"/>
  <text x="1420" y="545" text-anchor="middle" class="h">Optional later</text>
  <text x="1420" y="580" text-anchor="middle" class="t">Deploy Java app on</text>
  <text x="1420" y="605" text-anchor="middle" class="t">AWS EC2 / Elastic Beanstalk</text>
  <text x="1420" y="645" text-anchor="middle" class="small">Browser → AWS App → RDS</text>

  <path d="M410 232 H650" class="arrow"/><text x="530" y="218" text-anchor="middle" class="s">git clone / push / PR</text>
  <path d="M1180 225 H1000" class="arrow"/><text x="1090" y="210" text-anchor="middle" class="s">HTTP local demo</text>
  <path d="M825 325 V410 C825 455 945 455 1005 500" class="arrow"/><text x="945" y="405" text-anchor="middle" class="s">JDBC connection</text>
  <path d="M740 610 H875" class="arrow dash"/><text x="807" y="595" text-anchor="middle" class="s">allowed by</text>
  <path d="M360 575 C520 500 640 350 720 325" class="arrow dash"/><text x="520" y="455" text-anchor="middle" class="s">credentials from env</text>

  <text x="800" y="925" text-anchor="middle" font="16px Arial" fill="#374151">Initial phase: Java app runs locally and connects to AWS RDS. Extended phase: deploy app to AWS too.</text>
</svg>
