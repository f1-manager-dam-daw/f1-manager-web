<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constructors — F1 Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🏎 F1 Manager</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="drivers.html">Drivers</a>
                <a class="nav-link active" href="constructors.html">Constructors</a>
                <a class="nav-link" href="races.html">Races</a>
                <a class="nav-link" href="stats.html">Stats</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Constructors</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addConstructorModal">
                + Add Constructor
            </button>
        </div>

        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by name or nationality...">
        </div>

        <div id="loadingMsg" class="text-center text-muted my-4">Loading constructors...</div>
        <div id="errorMsg" class="alert alert-danger d-none"></div>

        <div id="constructorsTableContainer" class="d-none">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Full Name</th>
                        <th>Nationality</th>
                        <th>Championships</th>
                        <th>Wins</th>
                        <th>Points</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="constructorsTableBody"></tbody>
            </table>
        </div>

        <ul id="paginationContainer" class="pagination justify-content-center mt-3"></ul>
    </div>

    <!-- Add Constructor Modal -->
    <div class="modal fade" id="addConstructorModal" tabindex="-1" aria-labelledby="addConstructorModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addConstructorModalLabel">Add New Constructor</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="addConstructorForm">
              <div class="mb-3">
                <label for="constructorId" class="form-label">ID (e.g., ferrari)</label>
                <input type="text" class="form-control" id="constructorId" required>
              </div>
              <div class="mb-3">
                <label for="constructorName" class="form-label">Name (Short)</label>
                <input type="text" class="form-control" id="constructorNameForm" required>
              </div>
              <div class="mb-3">
                <label for="constructorFullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="constructorFullNameForm" required>
              </div>
              <div class="mb-3">
                <label for="constructorNationality" class="form-label">Nationality</label>
                <input type="text" class="form-control" id="constructorNationalityForm">
              </div>
              <button type="submit" class="btn btn-primary w-100">Save Constructor</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/constructors.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
