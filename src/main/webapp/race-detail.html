<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Detail — F1 Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🏎 F1 Manager</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="drivers.html">Drivers</a>
                <a class="nav-link" href="constructors.html">Constructors</a>
                <a class="nav-link active" href="races.html">Races</a>
                <a class="nav-link" href="stats.html">Stats</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <a href="races.html" class="btn btn-outline-secondary btn-sm mb-4">← Back to Races</a>

        <div id="loadingMsg" class="text-center text-muted my-4">Loading race...</div>
        <div id="errorMsg" class="alert alert-danger d-none"></div>

        <div id="raceDetail" class="d-none">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 id="raceName" class="fw-bold"></h2>
                    <div class="row mt-3">
                        <div class="col-md-3">
                            <p class="text-muted mb-1">Year</p>
                            <p id="raceYear" class="fw-bold"></p>
                        </div>
                        <div class="col-md-3">
                            <p class="text-muted mb-1">Round</p>
                            <p id="raceRound" class="fw-bold"></p>
                        </div>
                        <div class="col-md-3">
                            <p class="text-muted mb-1">Date</p>
                            <p id="raceDate" class="fw-bold"></p>
                        </div>
                        <div class="col-md-3">
                            <p class="text-muted mb-1">Circuit</p>
                            <p id="raceCircuit" class="fw-bold"></p>
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-3">
                            <p class="text-muted mb-1">Laps</p>
                            <p id="raceLaps" class="fw-bold"></p>
                        </div>
                        <div class="col-md-3">
                            <p class="text-muted mb-1">Distance</p>
                            <p id="raceDistance" class="fw-bold"></p>
                        </div>
                    </div>
                </div>
            </div>

            <h4 class="mb-3">Race Results</h4>
            <div id="resultsLoadingMsg" class="text-center text-muted">Loading results...</div>
            <div id="resultsTableContainer" class="d-none">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Position</th>
                            <th>Driver</th>
                            <th>Constructor</th>
                            <th>Grid</th>
                            <th>Laps</th>
                            <th>Points</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="resultsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/race-detail.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
