<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Races — F1 Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🏎 F1 Manager</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="drivers.html">Drivers</a>
                <a class="nav-link" href="constructors.html">Constructors</a>
                <a class="nav-link active" href="races.html">Races</a>
                <a class="nav-link" href="stats.html">Stats</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Races</h2>

        <div class="mb-3">
            <select id="yearFilter" class="form-select">
                <option value="">All seasons</option>
            </select>
        </div>

        <div id="loadingMsg" class="text-center text-muted my-4">Loading races...</div>
        <div id="errorMsg" class="alert alert-danger d-none"></div>

        <div id="racesTableContainer" class="d-none">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Year</th>
                        <th>Round</th>
                        <th>Grand Prix</th>
                        <th>Circuit</th>
                        <th>Date</th>
                        <th>Laps</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="racesTableBody"></tbody>
            </table>
        </div>

        <ul id="paginationContainer" class="pagination justify-content-center mt-3"></ul>
    </div>

    <script src="js/api.js"></script>
    <script src="js/races.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
